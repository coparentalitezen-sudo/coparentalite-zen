name: Vidéo marketing

# Rendu des Reels, pas Vercel : l'offre Hobby limite chaque route à dix
# secondes d'exécution (AGENTS.md, « Tâches planifiées »), largement en deçà
# de ce qu'exige l'encodage ffmpeg d'une vidéo de 28 secondes. Un runner
# GitHub Actions n'a pas cette limite.
#
# ffmpeg vient du paquet npm ffmpeg-static (voir src/lib/marketing/video.ts),
# téléchargé par « npm ci » comme n'importe quelle dépendance — aucune
# installation système à faire ici, le même mécanisme qui permet à ce
# dispositif de tourner sur un Mac Intel sans Homebrew fonctionne à
# l'identique sur ce runner Linux.
#
# Programmée le samedi soir plutôt que le dimanche : le rendu peut échouer
# (ffmpeg absent, planche injoignable), et une seule journée de marge avant
# les tâches Vercel du lundi matin (détection 5h00 UTC, bilan 5h30 UTC) ne
# laisserait pas le temps de le relancer à la main si besoin.

on:
  schedule:
    - cron: '0 22 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rendu:
    name: Rendu des Reels de la semaine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier ffmpeg
        run: node -e "require('node:child_process').execFileSync(require('ffmpeg-static'), ['-version'], { stdio: 'inherit' })"

      - name: Rendre et déposer les vidéos
        run: npm run video:render
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
