name: Migrations Supabase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        required: true
        default: verification
        type: choice
        options:
          - verification
          - appliquer

jobs:
  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Vérifier les migrations
        run: |
          supabase migration list

      - name: Appliquer les migrations
        if: inputs.mode == 'appliquer'
        run: |
          supabase db push
